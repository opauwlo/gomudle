name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # O dataset é gerado e commitado. Se alguém editar cartas.json à mão, o
      # gerador desfaz na próxima rodada sem ninguém perceber — então o CI
      # compara: regerar não pode mudar nada.
      - name: Conferir se cartas.json está em dia com o gerador
        run: |
          pnpm cartas
          git diff --exit-code src/dados/cartas.json
