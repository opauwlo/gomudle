<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1a15" />
    <title>Gomudle — a carta do dia do One Piece Card Game</title>
    <meta
      name="description"
      content="Uma carta do One Piece Card Game por dia pra adivinhar. Modos personagem, líder, efeito e arte, em Standard e EGB."
    />

    <!--
      Prévia de link, sem imagem por enquanto. `og:url` é ABSOLUTO porque
      WhatsApp, Twitter e companhia não resolvem caminho relativo — trocou de
      domínio, troque essa linha. Voltando a ter imagem, `og:image` tem a
      mesma regra e pede de volta as linhas de largura e altura.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gomudle" />
    <meta property="og:title" content="Gomudle — a carta do dia do One Piece Card Game" />
    <meta
      property="og:description"
      content="Uma carta por dia pra adivinhar, em Standard e EGB. Sem conta, sem anúncio."
    />
    <meta property="og:url" content="https://opauwlo.github.io/gomudle/" />
    <meta property="og:locale" content="pt_BR" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icone-192.png" />
    <meta name="apple-mobile-web-app-title" content="Gomudle" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E" />
    <!--
      A arte das cartas vem por CDN de imagem (ver src/jogo/imagens.ts). O
      preconnect resolve DNS e fecha o TLS enquanto o JavaScript ainda está
      baixando — sem ele a primeira carta só COMEÇA a chegar depois do
      handshake inteiro, que é o que se sente como "o jogo abriu sem imagem".
      O segundo endereço é a fonte reserva: dns-prefetch basta, porque na
      maioria das sessões ela nunca é usada.
    -->
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="dns-prefetch" href="https://cdn.statically.io" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
